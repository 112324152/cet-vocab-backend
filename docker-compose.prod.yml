services:
  mysql:
    image: mysql:8.0
    container_name: cet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: cet_vocab
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cet-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cet_vocab
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: deepseek-chat
      IMPORT_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      TZ: Asia/Shanghai
    volumes:
      - /root/ECDICT/ecdict.csv:/data/ecdict.csv:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../cet-vocab-frontend
      dockerfile: Dockerfile
    container_name: cet-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
